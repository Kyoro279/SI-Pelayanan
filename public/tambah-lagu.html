<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Lagu - KITTEENS HUB</title>
    <!--font modern standar Google-->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!--panggil CSS global dan CSS khusus edit/tambah lagu (karena tampilannya mirip, kita pake CSS yang sama buat edit)-->
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/edit-lagu.css">

    <!--ikon-ikon lucu-->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!--supabase! wajib buat nyambungin web kita ke database-->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<!--data-active="lagu" ngasi tau layout buat nyalain menu "Bank Lagu" pas halaman ini dibuka-->

<body data-active="lagu" style="display: none;">

    <!--penjaga gerbang: ngecek user login apa nggak, boleh masuk apa nggak-->
    <script src="/js/checkAuth.js"></script>
    <script>
        window.authReady = window.initAndCheckAuth();
    </script>

    <div class="layout">
        <!--wadah yang ntar bakal disuntik HTML Sidebar dari JS-->
        <div id="sidebar-container"></div>

        <!--ruang utama halaman-->
        <main class="main-content">
            <!--header halaman-->
            <div class="edit-header">
                <!--judul form-->
                <h1 class="edit-title">Lagu Baru</h1>
                <!--tombol Batal, balik lagi ke list lagu-->
                <button class="btn-cancel" onclick="window.location.href='/bank-lagu'">
                    Batal <i class="ph-bold ph-x"></i>
                </button>
            </div>

            <!--formulirnya kita bagi dua kolom (kiri & kanan) biar lebar layarnya kepake maksimal-->
            <div class="edit-grid">
                <!--kolom kiri: isian data pendek (Judul, Penyanyi, dll)-->
                <div class="form-left">
                    <div class="form-group">
                        <label class="form-label">Judul</label>
                        <input type="text" id="inputJudul" class="form-control" value="">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Penyanyi / Pengarang</label>
                        <input type="text" id="inputPenyanyi" class="form-control" value="">
                    </div>

                    <!--kategori sama Nada Dasar dibikin sebelahan biar hemat tempat-->
                    <div class="row-2">
                        <div class="form-group">
                            <label class="form-label">Kategori</label>
                            <select id="inputKategori" class="form-control">
                                <option value=""></option>
                                <option value="Praise">Praise</option>
                                <option value="Worship">Worship</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Nada Dasar</label>
                            <select id="inputNadaDasar" class="form-control">
                                <option value=""></option>
                                <option value="C">C</option>
                                <option value="C#">C#</option>
                                <option value="D">D</option>
                                <option value="Eb">Eb</option>
                                <option value="E">E</option>
                                <option value="F">F</option>
                                <option value="F#">F#</option>
                                <option value="G">G</option>
                                <option value="Ab">Ab</option>
                                <option value="A">A</option>
                                <option value="Bb">Bb</option>
                                <option value="B">B</option>
                            </select>
                        </div>
                    </div>

                    <!--kolom isi link YouTube biar nanti bisa nampil videonya otomatis-->
                    <div class="form-group">
                        <label class="form-label">Link Youtube</label>
                        <input type="text" id="inputLinkYoutube" class="form-control" value="">
                    </div>
                </div>

                <!--kolom kanan: khusus buat kotak gede isi Lirik & Chord, dan tombol Simpan-->
                <div class="form-right">
                    <div class="form-group">
                        <label class="form-label">Chord & Lirik</label>
                        <!--pake textarea biar bisa dienter-enter (multiline)-->
                        <textarea id="inputChordLirik" class="form-control textarea-lyrics"></textarea>
                    </div>

                    <!--tombol buat nge-submit formnya-->
                    <button class="btn-save" id="saveBtn">Tambah</button>
                </div>
            </div>
        </main>
    </div>

    <!--layout.js manggil kerangka sidebar-->
    <script src="/js/layout.js"></script>
    <!--lagu-form.js yang ngurusin nembak data form ini ke server/database-->
    <script src="/js/lagu-form.js"></script>
</body>

</html>
