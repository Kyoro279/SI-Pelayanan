<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap History - KITTEENS HUB</title>
    <!--import font inter dari google fonts-->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!--panggil file css global dan css khusus halaman rekap history-->
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/rekap-history.css">
    <!--library phosphor icons-->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!--library supabase untuk pengecekan sesi login-->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<!--data-active="history" untuk menandai menu rekap history yang aktif di sidebar-->
<body data-active="history" style="display: none;">
    <!--cek status login user sebelum menampilkan halaman-->
    <script src="/js/checkAuth.js"></script>
    <script>
        //simpan promise autentikasi agar ditunggu oleh rekap-history.js
        window.authReady = window.initAndCheckAuth();
    </script>

    <!--pembungkus layout utama (sidebar kiri dan konten kanan)-->
    <div class="layout">
        <!--wadah tempat komponen sidebar dimuat oleh layout.js-->
        <div id="sidebar-container"></div>

        <!--area konten utama halaman rekap history-->
        <main class="main-content">
            <!--bagian header halaman: judul dan tombol navigasi pemilih bulan-->
            <div class="rekap-header">
                <div class="header-text">
                    <h1>Rekap History</h1>
                    <p>Rekap bulanan dan progres pelayanan yang sudah berjalan vs tersisa.</p>
                </div>

                <!--navigasi untuk berpindah ke bulan sebelumnya atau selanjutnya-->
                <div class="month-selector">
                    <button id="btnPrevMonth"><i class="ph-bold ph-caret-left"></i></button>
                    <span id="currentMonthLabel">September 2026</span>
                    <button id="btnNextMonth"><i class="ph-bold ph-caret-right"></i></button>
                </div>
            </div>

            <!--tiga kartu ringkasan jumlah jadwal bulan ini (total, selesai, dan sisa)-->
            <div class="summary-cards">
                <div class="summary-card">
                    <div class="summary-title">Total jadwal bulan ini</div>
                    <div class="summary-value" id="summaryTotal">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-title">Sudah selesai</div>
                    <div class="summary-value" id="summarySelesai">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-title">Sisa jadwal</div>
                    <div class="summary-value highlight" id="summarySisa">0</div>
                </div>
            </div>

            <!--bagian daftar status setiap jadwal pelayanan pada bulan yang dipilih-->
            <div class="section-card">
                <h2 class="section-title">Status Jadwal (<span id="statusMonthLabel">September 2026</span>)</h2>
                <!--daftar jadwal dirender secara dinamis oleh rekap-history.js-->
                <div class="jadwal-list" id="jadwalList"></div>
            </div>

            <!--bagian daftar progress bar tugas pelayanan untuk setiap penatalayan-->
            <div class="section-card">
                <h2 class="section-title">Progres per Penatalayan</h2>
                <p class="section-subtitle">Berapa tugas yang sudah dijalani dan berapa yang masih tersisa bulan ini.</p>
                <!--daftar progress penatalayan dirender secara dinamis oleh rekap-history.js-->
                <div class="progres-list" id="progresList"></div>
            </div>
        </main>
    </div>

    <!--script pemuat sidebar dan logika utama halaman rekap history-->
    <script src="/js/layout.js"></script>
    <script src="/js/rekap-history.js"></script>
</body>

</html>
