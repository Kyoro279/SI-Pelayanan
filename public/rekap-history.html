<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap History - KITTEENS HUB</title>
    <!--panggil font inter dari mbah Google-->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!--css andalan kita-->
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/rekap-history.css">
    
    <!--icon Phosphor-->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!--jangan lupa Supabase buat narik data API-->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<!--data-active="history" biar di menu sebelah kiri (sidebar) yang nyala itu menu History-->
<body data-active="history" style="display: none;">
    <!--satpam depan pintu: ngecek login-->
    <script src="/js/checkAuth.js"></script>
    <script>
        window.authReady = window.initAndCheckAuth();
    </script>

    <div class="layout">
        <!--wadah buat numpangin Sidebar HTML dari layout.js-->
        <div id="sidebar-container"></div>

        <!--bagian utama halaman-->
        <main class="main-content">
            <!--header halaman-->
            <div class="rekap-header">
                <div class="header-text">
                    <h1>Rekap History</h1>
                    <p>Rekap bulanan dan progres pelayanan yang sudah berjalan vs tersisa.</p>
                </div>
                
                <!--pilihan bulan di pojok kanan atas-->
                <div class="month-selector">
                    <!--tombol mundur sebulan-->
                    <button id="btnPrevMonth"><i class="ph-bold ph-caret-left"></i></button>
                    <!--label bulan yang aktif saat ini-->
                    <span id="currentMonthLabel">September 2026</span>
                    <!--tombol maju sebulan-->
                    <button id="btnNextMonth"><i class="ph-bold ph-caret-right"></i></button>
                </div>
            </div>

            <!--tiga kotak statistik di atas (summary cards)-->
            <div class="summary-cards">
                <div class="summary-card">
                    <div class="summary-title">Total jadwal bulan ini</div>
                    <div class="summary-value" id="summaryTotal">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-title">Sudah selesai</div>
                    <div class="summary-value" id="summarySelesai">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-title">Sisa jadwal</div>
                    <div class="summary-value highlight" id="summarySisa">0</div>
                </div>
            </div>

            <!--bagian kiri: status jadwal per hari-->
            <div class="section-card">
                <!--label bulannya ikut keganti sesuai tombol di atas-->
                <h2 class="section-title">Status Jadwal (<span id="statusMonthLabel">September 2026</span>)</h2>
                <!--daftar jadwalnya bakal dilooping dan di-inject sama rekap-history.js di sini-->
                <div class="jadwal-list" id="jadwalList">
                    <!--dinamis dari JS-->
                </div>
            </div>

            <!--bagian bawah: progress bar tiap pelayan-->
            <div class="section-card">
                <h2 class="section-title">Progres per Penatalayan</h2>
                <p class="section-subtitle">Berapa tugas yang sudah dijalani dan berapa yang masih tersisa bulan ini.</p>
                <!--baris-baris nama pelayan sama progress barnya masuk ke div ini-->
                <div class="progres-list" id="progresList">
                    <!--dinamis dari JS-->
                </div>
            </div>
        </main>
    </div>

    <!--skrip di akhir body biar loading pagenya nggak nyendat-->
    <!--tukang pasang sidebar-->
    <script src="/js/layout.js"></script>
    <!--otaknya halaman rekap, ngitung matematika progress dan bikin HTML-->
    <script src="/js/rekap-history.js"></script>
</body>
</html>
