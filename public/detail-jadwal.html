<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Jadwal - KITTEENS HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/detail-jadwal.css">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Choices.js untuk Searchable Dropdown -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body data-active="jadwal" style="display: none;">

    <!-- Supabase Init & Auth Check -->
    <script src="/js/checkAuth.js"></script>
    <script>
        window.authReady = window.initAndCheckAuth();
    </script>

    <div class="layout">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <!-- Header Page -->
            <header class="detail-header">
                <div class="header-left">
                    <button class="btn-back" onclick="window.location.href='/jadwal'">
                        <i class="ph ph-arrow-left"></i>
                    </button>
                    <div>
                        <h1 class="page-title">Jadwal Pelayanan</h1>
                        <p class="page-subtitle">Informasi seputar pelayanan minggu ini</p>
                    </div>
                </div>
                <div class="header-right admin-only">
                </div>
            </header>

            <!-- Loading Spinner -->
            <div id="loading-indicator" class="loading-container">
                <div class="spinner"></div>
                <p>Memuat detail jadwal...</p>
            </div>

            <!-- Content Grid -->
            <div id="detail-content" class="detail-grid" style="display: none;">
                <!-- Left Column -->
                <div class="left-col">
                    <!-- Info Card -->
                    <div class="card info-card">
                        <p class="tanggal" id="detail-tanggal">-</p>
                        <h2 class="judul" id="detail-judul">-</h2>

                        <div class="section">
                            <p class="label">Tujuan</p>
                            <p class="value" id="detail-tujuan">-</p>
                        </div>

                        <div class="section">
                            <p class="label">Pengkhotbah</p>
                            <p class="value" id="detail-pengkotbah">-</p>
                        </div>
                    </div>

                    <!-- Tim Pelayanan Card -->
                    <div class="card tim-card">
                        <h3>Tim Pelayanan</h3>
                        <div class="tim-list" id="tim-list-container">
                            <!-- Injected via JS -->
                        </div>
                    </div>
                </div>

                <!-- Right Column -->
                <div class="right-col">
                    <div class="lagu-header">
                        <h3>Daftar Lagu</h3>
                        <button class="btn-tambah-lagu admin-only" id="btn-tambah-lagu">+Tambah Lagu</button>
                    </div>

                    <div class="lagu-list" id="lagu-list-container">
                        <!-- Injected via JS -->
                        <div class="empty-lagu">Belum ada lagu.</div>
                    </div>

                    <!-- Form Tambah Lagu (Inline) -->
                    <div class="card form-tambah-lagu" id="form-tambah-lagu" style="display: none;">
                        <select id="select-lagu">
                            <option value="">Cari Nama Lagu</option>
                        </select>
                        <div class="key-selector">
                            <label>Nada Dasar (Key):</label>
                            <select id="select-key" class="select-css">
                                <option value="C">C</option>
                                <option value="C#">C# / Db</option>
                                <option value="D">D</option>
                                <option value="D#">D# / Eb</option>
                                <option value="E">E</option>
                                <option value="F">F</option>
                                <option value="F#">F# / Gb</option>
                                <option value="G">G</option>
                                <option value="G#">G# / Ab</option>
                                <option value="A">A</option>
                                <option value="A#">A# / Bb</option>
                                <option value="B">B</option>
                            </select>
                        </div>
                        <div class="form-actions">
                            <button class="btn-masukkan" id="btn-submit-lagu">Masukkan</button>
                            <button class="btn-batal" id="btn-cancel-lagu">Batal</button>
                        </div>
                    </div>
                </div>

                <!-- Section Pesan Izin (Full Width di Bawah Grid Sesuai Gambar 4) -->
                <div class="card pesan-izin-card" id="berhalangan-section" style="display: none;">
                    <div class="pesan-izin-header">
                        <div>
                            <h3 class="pesan-izin-title">Pesan Izin</h3>
                            <p class="pesan-izin-subtitle" id="izin-subtitle">-</p>
                        </div>
                        <span class="izin-status-pill" id="izin-status-badge" style="display: none;">Sedang
                            Proses</span>
                    </div>

                    <div class="izin-messages" id="izin-chat-container">
                        <!-- Riwayat gelembung pesan izin di-inject via JS -->
                    </div>

                    <div class="izin-reply-box">
                        <label class="izin-reply-label" for="input-alasan-berhalangan">Balas</label>
                        <textarea id="input-alasan-berhalangan" class="izin-textarea"
                            placeholder="Tulis balasan untuk Worship Planner..."></textarea>
                        <div class="izin-actions">
                            <button type="button" class="btn-kirim-balasan" id="btn-submit-berhalangan">Kirim
                                Balasan</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/layout.js"></script>
    <script src="/js/detail-jadwal.js"></script>
</body>

</html>
