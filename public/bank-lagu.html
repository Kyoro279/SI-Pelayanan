<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Lagu - KITTEENS HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/bank-lagu.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<!-- Atribut data-active digunakan layout.js untuk highlight menu -->

<body data-active="lagu" style="display: none;">

    <!-- Supabase Init & Auth Check -->
    <script>
        // Buat promise agar script lain (seperti layout.js) bisa menunggu auth selesai
        window.authReady = (async function initAndCheckAuth() {
            try {
                // Ambil config Supabase dari backend (membaca dari .env)
                const respons = await fetch('/api/config');
                const config = await respons.json();

                // Buat instance global
                window.supabaseClient = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY);
                const supabase = window.supabaseClient;

                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    window.location.href = '/'; 
                    return null;
                } else {
                    const email = session.user.email;
                    const isSuperAdmin = email === 'matthewanders2709@gmail.com';
                    window.isSuperAdmin = isSuperAdmin;
                    window.userData = null;

                    if (!isSuperAdmin) {
                        try {
                            const resCheck = await fetch(`/api/akun/check/${encodeURIComponent(email)}`);
                            if (!resCheck.ok) {
                                await supabase.auth.signOut();
                                window.location.href = '/?error=unauthorized';
                                return null;
                            }
                            const checkData = await resCheck.json();
                            window.userData = checkData.data;
                        } catch (errDb) {
                            await supabase.auth.signOut();
                            window.location.href = '/?error=unauthorized';
                            return null;
                        }
                    }

                    document.body.style.display = '';
                    return session;
                }
            } catch (err) {
                console.error("Gagal memuat auth:", err);
            }
        })();
    </script>

    <div class="layout">
        <!-- Container untuk Component Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Konten Utama -->
        <main class="main-content">
            <div class="page-header">
                <div class="header-title">
                    <h1>Bank Lagu</h1>
                    <p class="subtitle" id="totalSongs">Memuat...</p>
                </div>
                <button class="btn-primary" onclick="window.location.href='/tambah-lagu'">+ Tambah Lagu</button>
            </div>

            <div class="filters">
                <div class="search-box">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Cari Lagu atau Artist">
                </div>
                <select class="category-select" id="filterCategory">
                    <option value="all">Semua Kategori</option>
                    <option value="Worship">Worship</option>
                    <option value="Praise">Praise</option>
                </select>
            </div>

            <div class="song-grid" id="songGrid">
                <!-- Data lagu akan dimuat secara dinamis oleh lagu.js -->
            </div>
        </main>
    </div>

    <!-- Script Injector & Logic Layout -->
    <script src="/js/layout.js"></script>
    <script src="/js/lagu.js"></script>
</body>

</html>
