<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Lagu - KITTEENS HUB</title>
    <!--import font Inter dari Google Fonts biar tulisannya keliatan modern dan rapi-->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!--panggil file CSS biar tampilannya cantik, global.css buat layout umum, bank-lagu.css buat styling spesifik halaman ini-->
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/bank-lagu.css">
    
    <!--panggil library icon dari Phosphor, ini yang bikin icon-icon (kayak lup pencarian) muncul-->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!--supabase CDN: senjata utama kita buat nyambung ke database tanpa ribet instal backend aneh-aneh-->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<!--atribut data-active="lagu" ini kepake banget buat nandain di Sidebar kalau kita lagi buka menu Bank Lagu. 
     style="display: none;" buat ngumpetin layar dulu sampai proses ngecek login kelar, biar gak berkedip aneh-->
<body data-active="lagu" style="display: none;">

    <!--supabase init & auth check: bagian yang ngecek apakah user udah login apa belum-->
    <script src="/js/checkAuth.js"></script>
    <script>
        //jalanin fungsi ngecek login dan simpan 'janjinya' (Promise) di authReady
        //nanti skrip lagu.js bakal nungguin ini kelar sebelum ngapa-ngapain
        window.authReady = window.initAndCheckAuth();
    </script>

    <!--bungkus utama seluruh layar (Sidebar + Konten Kanan)-->
    <div class="layout">
        <!--tempat kosong ini (container) nantinya bakal diisi HTML Sidebar secara otomatis sama script layout.js-->
        <div id="sidebar-container"></div>

        <!--bagian konten kanan utama-->
        <main class="main-content">
            <!--header halaman: judul, subjudul, sama tombol tambah-->
            <div class="page-header">
                <div class="header-title">
                    <h1>Bank Lagu</h1>
                    <!--angka jumlah lagunya ntar bakal diganti pake JS pas data dapet dari database-->
                    <p class="subtitle" id="totalSongs">Memuat...</p>
                </div>
                <!--tombol biru nambah lagu. kalo diklik lari ke halaman /tambah-lagu. 
                     ntar tombol ini disembunyiin JS kalo yang login bukan admin!-->
                <button class="btn-primary" onclick="window.location.href='/tambah-lagu'">+ Tambah Lagu</button>
            </div>

            <!--area pencarian dan filter-->
            <div class="filters">
                <!--kotak search pake icon lup-->
                <div class="search-box">
                    <i class="ph ph-magnifying-glass"></i>
                    <!--tempat user ngetik pencarian-->
                    <input type="text" id="searchInput" placeholder="Cari Lagu atau Artist">
                </div>
                <!--dropdown buat milih kategori lagu. ntar JS bakal filter sesuai pilihan ini-->
                <select class="category-select" id="filterCategory">
                    <option value="all">Semua Kategori</option>
                    <option value="Worship">Worship</option>
                    <option value="Praise">Praise</option>
                </select>
            </div>

            <!--wadah (grid) buat naro kotak-kotak card lagu-->
            <div class="song-grid" id="songGrid">
                <!--nah ini dikosongin soalnya data lagu bakal dimuat (ditarik) secara otomatis 
                     oleh file lagu.js trus dimasukin ke sini satu per satu-->
            </div>
        </main>
    </div>

    <!--script injector & logic layout-->
    <!--layout.js ini tugasnya nyuntikin file sidebar.html ke dalem div sidebar-container di atas-->
    <script src="/js/layout.js"></script>
    <!--lagu.js ini otaknya halaman ini, mulai dari narik data, ngerender list lagu, sampe hapus lagu-->
    <script src="/js/lagu.js"></script>
</body>
</html>
