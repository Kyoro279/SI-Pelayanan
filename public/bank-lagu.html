<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Lagu - KITTEENS HUB</title>
    <!--import font inter dari google fonts-->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!--panggil file css global dan css khusus halaman bank lagu-->
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/bank-lagu.css">
    <!--library phosphor icons untuk ikon pencarian dan musik-->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!--library supabase untuk autentikasi sesi login-->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<!--data-active="lagu" untuk menandai menu bank lagu yang aktif di sidebar-->
<body data-active="lagu" style="display: none;">

    <!--cek status login user sebelum menampilkan halaman-->
    <script src="/js/checkAuth.js"></script>
    <script>
        //simpan promise pengecekan auth agar ditunggu oleh lagu.js
        window.authReady = window.initAndCheckAuth();
    </script>

    <!--pembungkus layout utama (sidebar kiri dan konten kanan)-->
    <div class="layout">
        <!--wadah kosong tempat komponen sidebar dimuat oleh layout.js-->
        <div id="sidebar-container"></div>

        <!--area konten utama halaman bank lagu-->
        <main class="main-content">
            <!--bagian header halaman: judul, jumlah lagu, dan tombol tambah lagu-->
            <div class="page-header">
                <div class="header-title">
                    <h1>Bank Lagu</h1>
                    <!--jumlah lagu akan diperbarui otomatis oleh lagu.js-->
                    <p class="subtitle" id="totalSongs">Memuat...</p>
                </div>
                <!--tombol menuju form tambah lagu (disembunyikan jika user bukan admin/music director)-->
                <button class="btn-primary" onclick="window.location.href='/tambah-lagu'">+ Tambah Lagu</button>
            </div>

            <!--bagian filter: kolom pencarian judul/penyanyi dan pilihan kategori-->
            <div class="filters">
                <!--kotak input pencarian dengan ikon kaca pembesar-->
                <div class="search-box">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Cari Lagu atau Artist">
                </div>
                <!--dropdown filter berdasarkan kategori lagu-->
                <select class="category-select" id="filterCategory">
                    <option value="all">Semua Kategori</option>
                    <option value="Worship">Worship</option>
                    <option value="Praise">Praise</option>
                </select>
            </div>

            <!--wadah grid tempat daftar card lagu dirender secara dinamis oleh lagu.js-->
            <div class="song-grid" id="songGrid"></div>
        </main>
    </div>

    <!--script pemuat sidebar dan logika utama halaman bank lagu-->
    <script src="/js/layout.js"></script>
    <script src="/js/lagu.js"></script>
</body>

</html>
