<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berhalangan - KITTEENS HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/berhalangan.css">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body data-active="berhalangan" style="display: none;">

    <!-- Supabase Init & Auth Check -->
    <script src="/js/checkAuth.js"></script>
    <script>
        window.authReady = window.initAndCheckAuth();
    </script>

    <div class="layout">
        <!-- Sidebar Container -->
        <div id="sidebar-container"></div>

        <!-- Konten Utama Halaman Berhalangan -->
        <main class="main-content">
            <header class="berhalangan-header">
                <h1 class="page-title">Berhalangan</h1>
            </header>

            <!-- 3 Tab Filter: Semua, Sedang Proses, Selesai -->
            <div class="berhalangan-tabs">
                <button type="button" class="tab-btn active" data-filter="semua" id="tab-semua">
                    <span>Semua</span>
                    <span class="tab-badge" id="badge-semua" style="display: none;">0</span>
                </button>
                <button type="button" class="tab-btn" data-filter="proses" id="tab-proses">
                    <span>Sedang Proses</span>
                    <span class="tab-badge" id="badge-proses" style="display: none;">0</span>
                </button>
                <button type="button" class="tab-btn" data-filter="selesai" id="tab-selesai">
                    <span>Selesai</span>
                    <span class="tab-badge" id="badge-selesai" style="display: none;">0</span>
                </button>
            </div>

            <!-- Layout 2 Kolom: Daftar Inbox (Kiri) & Percakapan (Kanan) -->
            <section class="berhalangan-grid">
                <!-- Kolom Kiri: Daftar Pesan Izin (inbox-list) -->
                <div class="inbox-panel">
                    <div class="inbox-list" id="inbox-list-container">
                        <div class="empty-inbox">Memuat data...</div>
                    </div>
                </div>

                <!-- Kolom Kanan: Percakapan & Balasan -->
                <div class="chat-panel" id="chat-panel-container">
                    <div class="empty-chat">Pilih salah satu pesan di sebelah kiri untuk melihat percakapan.</div>
                </div>
            </section>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Script Layout & Berhalangan -->
    <script src="/js/layout.js"></script>
    <script src="/js/berhalangan.js"></script>
</body>

</html>
