<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - KITTEENS HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<!-- Atribut data-active digunakan layout.js untuk highlight menu -->

<body data-active="dashboard" style="display: none;">

    <!-- Script untuk inisialisasi Supabase dan mengecek apakah user sudah login -->
    <script src="/js/checkAuth.js"></script>
    <script>
        window.authReady = window.initAndCheckAuth({
            onSuccess: (session) => {
                const email = session.user.email;
                const metadata = session.user.user_metadata || {};
                const fullName = window.userData ? window.userData.nama_lengkap : (metadata.full_name || email.split('@')[0]);
                const role = window.userData ? window.userData.role : (window.isSuperAdmin ? 'Admin' : 'Servant');

                document.getElementById('header-user-name').textContent = fullName;
                document.querySelector('.role-text').textContent = `Log in sebagai ${role}`;

                const roleLower = role.toLowerCase();
                if (roleLower === 'admin') {
                    document.getElementById('card-akun').style.display = 'flex';
                } else if (roleLower === 'worship planner' || roleLower === 'wp') {
                    document.getElementById('card-berhalangan').style.display = 'flex';
                }
            }
        });
    </script>

    <div class="layout">
        <!-- Container untuk Component Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Konten Utama -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <div class="welcome-text">
                    <p class="subtitle">Selamat datang kembali,</p>
                    <h1 class="title" id="header-user-name">Memuat...</h1>
                    <p class="role-text">Log in sebagai ...</p>
                </div>
                <div class="notification-icon" onclick="openNotificationModal()" title="Notifikasi">
                    <i class="ph ph-bell"></i>
                    <span class="badge" id="notif-badge">0</span>
                </div>
            </header>

            <!-- Quick Links -->
            <section class="quick-links">
                <div class="quick-card" onclick="window.location.href='/jadwal'">
                    <div class="icon-box"><i class="ph ph-calendar-blank"></i></div>
                    <div class="card-title">Jadwal Pelayanan</div>
                    <div class="arrow"><i class="ph ph-arrow-right"></i></div>
                </div>
                <div class="quick-card" onclick="window.location.href='/bank-lagu'">
                    <div class="icon-box"><i class="ph ph-music-notes"></i></div>
                    <div class="card-title">Bank Lagu</div>
                    <div class="arrow"><i class="ph ph-arrow-right"></i></div>
                </div>
                <div class="quick-card" id="card-akun" onclick="window.location.href='/manajemen-akun'" style="display: none;">
                    <div class="icon-box"><i class="ph ph-users"></i></div>
                    <div class="card-title">Manajemen Akun</div>
                    <div class="arrow"><i class="ph ph-arrow-right"></i></div>
                </div>
                <div class="quick-card" id="card-berhalangan" onclick="window.location.href='/berhalangan'" style="display: none;">
                    <div class="icon-box"><i class="ph ph-question"></i></div>
                    <div class="card-title">Berhalangan</div>
                    <div class="arrow"><i class="ph ph-arrow-right"></i></div>
                </div>
            </section>

            <!-- Pelayanan Berikutnya -->
            <section class="next-service">
                <div class="card-header">
                    <span class="label">PELAYANAN BERIKUTNYA</span>
                    <button class="btn-detail" onclick="window.location.href='/jadwal'">Detail →</button>
                </div>
                <div class="service-content">
                    <h2>Memuat...</h2>
                    <p class="date">-</p>
                    <p class="desc">Sedang memuat data...</p>
                </div>
            </section>

            <!-- Jadwal Mendatang -->
            <section class="upcoming-schedule">
                <div class="section-header">
                    <h2>Jadwal Mendatang</h2>
                    <a href="/jadwal" class="view-all">Lihat Semua</a>
                </div>
                <div class="schedule-grid">
                    <p style="color: #64748B; font-size: 14px; grid-column: 1 / -1;">Memuat data...</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Notification Modal -->
    <div id="notif-overlay" class="notif-overlay" style="display: none;" onclick="closeNotificationModal()"></div>
    <div id="notif-modal" class="notif-modal" style="display: none;">
        <div class="notif-header">
            <h3><i class="ph ph-bell"></i> Notifikasi</h3>
            <button class="btn-close" onclick="closeNotificationModal()"><i class="ph ph-x"></i></button>
        </div>
        <div class="notif-body" id="notif-body">
            <!-- Injected by JS -->
            <p style="text-align: center; color: var(--text-muted); font-size: 14px; padding: 20px;">Tidak ada
                notifikasi baru.</p>
        </div>
    </div>

    <!-- Script Injector & Logic Layout -->
    <script src="/js/layout.js"></script>
    <script src="/js/dashboard.js"></script>
</body>

</html>
