<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - KITTEENS HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<!-- Atribut data-active digunakan layout.js untuk highlight menu -->

<body data-active="dashboard" style="display: none;">

    <!-- Supabase Init & Auth Check -->
    <script>
        // Buat promise agar script lain (seperti layout.js) bisa menunggu auth selesai
        window.authReady = (async function initAndCheckAuth() {
            try {
                // Ambil config Supabase dari backend (membaca dari .env)
                const respons = await fetch('/api/config');
                const config = await respons.json();

                // Buat instance global
                window.supabaseClient = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY);
                const supabase = window.supabaseClient;

                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    window.location.href = '/'; // Redirect ke halaman login jika belum login
                    return null;
                } else {
                    const email = session.user.email;
                    const isSuperAdmin = email === 'matthewanders2709@gmail.com';
                    window.isSuperAdmin = isSuperAdmin;
                    window.userData = null;

                    // Verifikasi apakah email ada di database (kecuali super admin)
                    if (!isSuperAdmin) {
                        try {
                            const resCheck = await fetch(`/api/akun/check/${encodeURIComponent(email)}`);
                            if (!resCheck.ok) {
                                await supabase.auth.signOut();
                                window.location.href = '/?error=unauthorized';
                                return null;
                            }
                            const checkData = await resCheck.json();
                            window.userData = checkData.data;
                        } catch (errDb) {
                            await supabase.auth.signOut();
                            window.location.href = '/?error=unauthorized';
                            return null;
                        }
                    }

                    // Tampilkan nama user di header dashboard
                    const metadata = session.user.user_metadata || {};
                    const fullName = window.userData ? window.userData.nama_lengkap : (metadata.full_name || email.split('@')[0]);
                    
                    const roleText = window.userData ? window.userData.role : (isSuperAdmin ? 'Admin' : 'Guest');
                    const roleLabel = document.querySelector('.role-text');
                    if (roleLabel) roleLabel.textContent = `Log in sebagai ${roleText}`;

                    const updateName = () => {
                        const headerUserName = document.getElementById('header-user-name');
                        if (headerUserName) headerUserName.textContent = fullName;
                    };

                    if (document.readyState === 'loading') {
                        document.addEventListener('DOMContentLoaded', () => { updateName(); document.body.style.display = ''; });
                    } else {
                        updateName();
                        document.body.style.display = '';
                    }
                    return session;
                }
            } catch (err) {
                console.error("Gagal memuat auth:", err);
            }
        })();
    </script>

    <div class="layout">
        <!-- Container untuk Component Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Konten Utama -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <div class="welcome-text">
                    <p class="subtitle">Selamat datang kembali,</p>
                    <h1 class="title" id="header-user-name">Memuat...</h1>
                    <p class="role-text">Log in sebagai Admin</p>
                </div>
                <div class="notification-icon">
                    <i class="ph ph-bell"></i>
                    <span class="badge">2</span>
                </div>
            </header>

            <!-- Quick Links -->
            <section class="quick-links">
                <div class="quick-card" onclick="window.location.href='/jadwal'" style="cursor: pointer;">
                    <div class="icon-box"><i class="ph ph-calendar-blank"></i></div>
                    <div class="card-title">Jadwal Pelayanan</div>
                    <div class="arrow"><i class="ph ph-arrow-right"></i></div>
                </div>
                <div class="quick-card" onclick="window.location.href='/bank-lagu'" style="cursor: pointer;">
                    <div class="icon-box"><i class="ph ph-music-notes"></i></div>
                    <div class="card-title">Bank Lagu</div>
                    <div class="arrow"><i class="ph ph-arrow-right"></i></div>
                </div>
                <div class="quick-card" onclick="window.location.href='/manajemen-akun'" style="cursor: pointer;">
                    <div class="icon-box"><i class="ph ph-users"></i></div>
                    <div class="card-title">Manajemen Akun</div>
                    <div class="arrow"><i class="ph ph-arrow-right"></i></div>
                </div>
            </section>

            <!-- Pelayanan Berikutnya -->
            <section class="next-service">
                <div class="card-header">
                    <span class="label">PELAYANAN BERIKUTNYA</span>
                    <button class="btn-detail" onclick="window.location.href='/jadwal'">Detail →</button>
                </div>
                <div class="service-content">
                    <h2>Memuat...</h2>
                    <p class="date">-</p>
                    <p class="desc">Sedang memuat data...</p>
                </div>
            </section>

            <!-- Jadwal Mendatang -->
            <section class="upcoming-schedule">
                <div class="section-header">
                    <h2>Jadwal Mendatang</h2>
                    <a href="/jadwal" class="view-all">Lihat Semua</a>
                </div>
                <div class="schedule-grid">
                    <p style="color: #64748B; font-size: 14px; grid-column: 1 / -1;">Memuat data...</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Script Injector & Logic Layout -->
    <script src="/js/layout.js"></script>
    <script src="/js/dashboard.js"></script>
</body>

</html>
