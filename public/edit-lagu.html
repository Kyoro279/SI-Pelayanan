<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Lagu - KITTEENS HUB</title>
    <!--import font Inter dari Google Fonts biar desainnya clean-->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!--panggil CSS global dan CSS khusus form edit/tambah lagu-->
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/edit-lagu.css">
    
    <!--phosphor icons buat nampilin icon silang (X)-->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!--supabase CDN buat koneksi ke database-->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<!--data-active="lagu" ngasi tau sidebar buat highlight menu "Bank Lagu" pas di halaman ini-->
<body data-active="lagu" style="display: none;">

    <!--cek dulu, nih user udah login belum?-->
    <script src="/js/checkAuth.js"></script>
    <script>
        window.authReady = window.initAndCheckAuth();
    </script>

    <div class="layout">
        <!--wadah kosong yang nanti bakal diisi sama komponen Sidebar-->
        <div id="sidebar-container"></div>

        <!--ruang konten utama form-->
        <main class="main-content">
            <!--header halaman-->
            <div class="edit-header">
                <h1 class="edit-title">Edit Lagu</h1>
                <!--tombol Batal, pake history.back() aja biar balik ke halaman lagu yang tadi lagi dibuka-->
                <button class="btn-cancel" onclick="window.history.back()">
                    Batal <i class="ph-bold ph-x"></i>
                </button>
            </div>

            <!--form kita bagi dua kolom (kiri & kanan) biar lebarnya pas di layar desktop-->
            <div class="edit-grid">
                <!--kolom kiri: isian data simpel (Judul, Penyanyi, dll)-->
                <div class="form-left">
                    <div class="form-group">
                        <label class="form-label">Judul</label>
                        <input type="text" id="inputJudul" class="form-control" value="">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Penyanyi / Pengarang</label>
                        <input type="text" id="inputPenyanyi" class="form-control" value="">
                    </div>

                    <!--kategori dan Nada Dasar kita jejerin sebelahan-->
                    <div class="row-2">
                        <div class="form-group">
                            <label class="form-label">Kategori</label>
                            <select id="inputKategori" class="form-control">
                                <option>Praise</option>
                                <option>Worship</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Nada Dasar</label>
                            <select id="inputNadaDasar" class="form-control">
                                <option value=""></option>
                                <option value="C">C</option>
                                <option value="C#">C#</option>
                                <option value="D">D</option>
                                <option value="Eb">Eb</option>
                                <option value="E">E</option>
                                <option value="F">F</option>
                                <option value="F#">F#</option>
                                <option value="G">G</option>
                                <option value="Ab">Ab</option>
                                <option value="A">A</option>
                                <option value="Bb">Bb</option>
                                <option value="B">B</option>
                            </select>
                        </div>
                    </div>

                    <!--kotak buat nempelin link YouTube-->
                    <div class="form-group">
                        <label class="form-label">Link Youtube</label>
                        <input type="text" id="inputLinkYoutube" class="form-control" value="">
                    </div>
                </div>

                <!--kolom kanan: kotak gede khusus teks panjang Lirik & Chord-->
                <div class="form-right">
                    <div class="form-group">
                        <label class="form-label">Chord & Lirik</label>
                        <!--pake textarea biar ngetiknya bisa dienter-enter-->
                        <textarea id="inputChordLirik" class="form-control textarea-lyrics"></textarea>
                    </div>
                    
                    <!--tombol buat nge-submit alias ngirim hasil editan ke database-->
                    <button class="btn-save" id="saveBtn">Simpan</button>
                </div>
            </div>
        </main>
    </div>

    <!--layout.js manggil file html sidebar-->
    <script src="/js/layout.js"></script>
    <!--lagu-form.js yang ngurusin nembak data form ini ke API update (PUT)-->
    <script src="/js/lagu-form.js"></script>
</body>

</html>
