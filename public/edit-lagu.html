<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Lagu - KITTEENS HUB</title>
    <!--import font inter dari google fonts-->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!--panggil css global dan css khusus form tambah/edit lagu-->
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/edit-lagu.css">
    <!--library phosphor icons-->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!--library supabase untuk cek sesi login-->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<!--data-active="lagu" untuk menandai menu bank lagu di sidebar-->
<body data-active="lagu" style="display: none;">

    <!--cek status login user sebelum menampilkan form-->
    <script src="/js/checkAuth.js"></script>
    <script>
        //simpan promise autentikasi agar ditunggu oleh lagu-form.js
        window.authReady = window.initAndCheckAuth();
    </script>

    <!--pembungkus layout utama-->
    <div class="layout">
        <!--wadah tempat sidebar dimuat oleh layout.js-->
        <div id="sidebar-container"></div>

        <!--area konten utama form edit lagu-->
        <main class="main-content">
            <!--bagian header form: judul halaman dan tombol batal kembali ke halaman sebelumnya-->
            <div class="edit-header">
                <h1 class="edit-title">Edit Lagu</h1>
                <button class="btn-cancel" onclick="window.history.back()">
                    Batal <i class="ph-bold ph-x"></i>
                </button>
            </div>

            <!--grid dua kolom untuk form edit lagu-->
            <div class="edit-grid">
                <!--kolom kiri: input informasi dasar lagu (judul, penyanyi, kategori, nada dasar, link youtube)-->
                <div class="form-left">
                    <div class="form-group">
                        <label class="form-label">Judul</label>
                        <input type="text" id="inputJudul" class="form-control" value="">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Penyanyi / Pengarang</label>
                        <input type="text" id="inputPenyanyi" class="form-control" value="">
                    </div>

                    <!--baris dua kolom untuk pilihan kategori dan nada dasar-->
                    <div class="row-2">
                        <div class="form-group">
                            <label class="form-label">Kategori</label>
                            <select id="inputKategori" class="form-control">
                                <option>Praise</option>
                                <option>Worship</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Nada Dasar</label>
                            <select id="inputNadaDasar" class="form-control">
                                <option value=""></option>
                                <option value="C">C</option>
                                <option value="C#">C#</option>
                                <option value="D">D</option>
                                <option value="Eb">Eb</option>
                                <option value="E">E</option>
                                <option value="F">F</option>
                                <option value="F#">F#</option>
                                <option value="G">G</option>
                                <option value="Ab">Ab</option>
                                <option value="A">A</option>
                                <option value="Bb">Bb</option>
                                <option value="B">B</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Link Youtube</label>
                        <input type="text" id="inputLinkYoutube" class="form-control" value="">
                    </div>
                </div>

                <!--kolom kanan: textarea chord & lirik beserta tombol simpan perubahan-->
                <div class="form-right">
                    <div class="form-group">
                        <label class="form-label">Chord & Lirik</label>
                        <textarea id="inputChordLirik" class="form-control textarea-lyrics"></textarea>
                    </div>

                    <!--tombol untuk menyimpan perubahan lagu ke database-->
                    <button class="btn-save" id="saveBtn">Simpan</button>
                </div>
            </div>
        </main>
    </div>

    <!--script pemuat sidebar dan pengendali form lagu-->
    <script src="/js/layout.js"></script>
    <script src="/js/lagu-form.js"></script>
</body>

</html>
